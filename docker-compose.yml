services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sectoral-hub
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    networks:
      - sectoralhub
    depends_on:
      - db

  nginx: 
    image: nginx:alpine
    container_name: sectoralhub_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-7788}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sectoralhub

  db:
    image: mysql:8.0
    container_name: sectoralhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sectoralhub
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sectoralhub_pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-9988}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - sectoralhub

networks:
  sectoralhub:
    driver: bridge

volumes:
  db_data:
    driver: local